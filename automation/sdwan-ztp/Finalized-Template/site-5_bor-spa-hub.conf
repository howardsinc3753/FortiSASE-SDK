# ============================================================================
# BOR NODE + SPA HUB (bridge) — Site-5 (hub-5)   [instantiated for review]
# = BOR spoke (dual on-ramp, EGRESS-ONLY) + SPA hub (SASE_Hub dial-up + BGP RR)
# router-id 10.30.1.105 · WAN 10.200.5.0/24 · LAN 10.200.50.0/24
# fabric overlay 10.10.50.0/24 · hub loopback 10.123.123.5  (distinct from hub-1)
# ----------------------------------------------------------------------------
# APPLIED (pending your confirm — see last chat): [D1] hand-built explicit SASE_Hub
#   (not the fabric-vpn wizard) · [D3] BOR side egress-only · [D4] router-id 10.30.1.105
# DERIVED VALUES to verify against your real allocation: HUB_ROUTER_ID, HUB_LOOPBACK,
#   FABRIC_OVERLAY_SUBNET/pool — must be UNIQUE per hub (do not reuse hub-1's 10.10.10.x/.123.1).
# REQUIRES: public IP/EIP on port1; FortiSASE SPA connector pointed at this hub
#   (its public IP + FABRIC_PSK). PSKs = <INJECT_AT_DEPLOY> (secure cred provider).
# ============================================================================

config system global
    set hostname "hub-5"
    set alias "FortiGate-ARM64-AWS"
    set timezone "US/Pacific"
    set admin-sport 10443
    set admintimeout 480
    set gui-auto-upgrade-setup-warning disable
end
config system fortiguard
    set auto-firmware-upgrade disable
end
config system settings
    set auxiliary-session enable
end

config system interface
    edit "port1"
        set alias "WAN"
        set ip 10.200.5.10 255.255.255.0
        set allowaccess ping https ssh fgfm
        set role wan
        set mtu-override enable
        set mtu 9001
    next
    edit "port2"
        set alias "LAN"
        set ip 10.200.50.10 255.255.255.0
        set allowaccess ping https ssh
        set role lan
        set mtu-override enable
        set mtu 9001
    next
    edit "SASE_Hub_Lo"
        set ip 10.123.123.5 255.255.255.255
        set allowaccess ping
        set type loopback
    next
    edit "SASE_Hub"
        set ip 10.10.50.253 255.255.255.255
        set remote-ip 10.10.50.254 255.255.255.0
        set allowaccess ping
        set type tunnel
        set interface "port1"
    next
    edit "ONRAMP_Dallas"
        set type tunnel
        set interface "port1"
    next
    edit "ONRAMP_MIA"
        set type tunnel
        set interface "port1"
    next
end

config firewall address
    edit "hub-5-LAN"
        set subnet 10.200.50.0 255.255.255.0
    next
    edit "SASE_Hub-Loopback"
        set subnet 10.123.123.5 255.255.255.255
    next
    edit "ONRAMP_DAL_PUBLIC"
        set type fqdn
        set allow-routing enable
        set fqdn "ipsec-<tenant>-dfw-f3.prod.fortisase.com"
    next
    edit "ONRAMP_MIA_PUBLIC"
        set type fqdn
        set allow-routing enable
        set fqdn "ipsec-<tenant>-mia-f3.prod.fortisase.com"
    next
end

config vpn ipsec phase1-interface
    # --- SPA HUB: FortiSASE PoPs dial IN here (dynamic dial-up server) ---
    edit "SASE_Hub"
        set type dynamic
        set interface "port1"
        set ike-version 2
        set peertype any
        set net-device disable
        set mode-cfg enable
        set add-route disable
        set dpd on-idle
        set dpd-retryinterval 60
        set dhgrp 20 15 14
        set auto-discovery-sender enable
        set network-overlay enable
        set network-id 1
        set transport auto
        set ipv4-start-ip 10.10.50.1
        set ipv4-end-ip 10.10.50.252
        set ipv4-netmask 255.255.255.0
        set proposal aes256-sha256 aes256-sha384 aes256-sha512 aes128-sha256
        set psksecret <INJECT_AT_DEPLOY>
    next
    # --- BOR on-ramps: hub's OWN SIA egress (EGRESS-ONLY, no BGP over these) ---
    edit "ONRAMP_Dallas"
        set type ddns
        set interface "port1"
        set ike-version 2
        set peertype any
        set net-device disable
        set mode-cfg enable
        set proposal aes256-sha256
        set dhgrp 5 14
        set network-overlay enable
        set network-id 0
        set transport auto
        set fortinet-esp enable
        set dpd on-idle
        set remotegw-ddns "ipsec-<tenant>-dfw-f3.prod.fortisase.com"
        set psksecret <INJECT_AT_DEPLOY>
    next
    edit "ONRAMP_MIA"
        set type ddns
        set interface "port1"
        set ike-version 2
        set peertype any
        set net-device disable
        set mode-cfg enable
        set proposal aes256-sha256
        set dhgrp 5 14
        set network-overlay enable
        set network-id 0
        set transport auto
        set fortinet-esp enable
        set dpd on-idle
        set remotegw-ddns "ipsec-<tenant>-mia-f3.prod.fortisase.com"
        set psksecret <INJECT_AT_DEPLOY>
    next
end

config vpn ipsec phase2-interface
    edit "SASE_Hub"
        set phase1name "SASE_Hub"
        set proposal aes256-sha256 aes256gcm
        set dhgrp 20 15 14
        set keylifeseconds 86400
    next
    edit "ONRAMP_Dallas"
        set phase1name "ONRAMP_Dallas"
        set proposal aes256-sha256
        set dhgrp 5 14
    next
    edit "ONRAMP_MIA"
        set phase1name "ONRAMP_MIA"
        set proposal aes256-sha256
        set dhgrp 5 14
    next
end

# EGRESS-ONLY BOR side: PoP publics via WAN (FQDN) + WAN default fallback.
# NO /32 to 172.16.8.1/172.16.0.1 and NO BGP over ONRAMP — hub reaches the branch
# plane via the SPA fabric (SASE_Hub), not via ONRAMP-BGP.
config router static
    edit 1
        set gateway 10.200.5.1
        set distance 20
        set device "port1"
        set comment "Floating WAN default (fallback; SIA default via on-ramps)"
    next
    edit 6
        set dstaddr "ONRAMP_DAL_PUBLIC"
        set gateway 10.200.5.1
        set device "port1"
        set comment "DAL BOR PoP public via WAN"
    next
    edit 7
        set dstaddr "ONRAMP_MIA_PUBLIC"
        set gateway 10.200.5.1
        set device "port1"
        set comment "MIA BOR PoP public via WAN"
    next
    edit 10
        set dst 203.0.113.1 255.255.255.255
        set gateway 10.200.5.1
        set device "port1"
        set comment "Bastion / management return path"
    next
end

# Overlay hairpin — lets PoP-side traffic transit the hub (spoke<->spoke via hub)
config router policy
    edit 1
        set input-device "SASE_Hub"
        set srcaddr "all"
        set dstaddr "all"
        set output-device "SASE_Hub"
        set comments "SPA hub overlay hairpin"
    next
end

# BGP ROUTE-REFLECTOR for the SPA fabric (PoPs are RR-clients). AS 65001.
config router bgp
    set as 65001
    set router-id 10.30.1.105
    set ibgp-multipath enable
    set additional-path enable
    set additional-path-select 4
    set graceful-restart enable
    config neighbor-group
        edit "SASE_Hub"
            set interface "SASE_Hub"
            set remote-as 65001
            set route-reflector-client enable
            set next-hop-self enable
            set additional-path send
            set adv-additional-path 4
            set capability-graceful-restart enable
            set link-down-failover enable
            set soft-reconfiguration enable
        next
    end
    config neighbor-range
        edit 1
            set prefix 10.10.50.0 255.255.255.0
            set neighbor-group "SASE_Hub"
        next
    end
    config network
        edit 1
            set prefix 10.10.50.0 255.255.255.0
        next
        edit 2
            set prefix 10.200.50.0 255.255.255.0
        next
        edit 3
            set prefix 10.123.123.5 255.255.255.255
        next
    end
end

# SD-WAN: hub's OWN internet/SIA via the on-ramps, WAN underlay fallback
config system sdwan
    set status enable
    config zone
        edit "SDWAN_ZONE"
        next
        edit "Underlay_ZONE"
        next
    end
    config members
        edit 1
            set interface "ONRAMP_Dallas"
            set zone "SDWAN_ZONE"
        next
        edit 2
            set interface "ONRAMP_MIA"
            set zone "SDWAN_ZONE"
        next
        edit 3
            set interface "port1"
            set zone "Underlay_ZONE"
            set gateway 10.200.5.1
        next
    end
    config health-check
        edit "SIA_Health"
            set server "8.8.8.8" "1.1.1.1"
            set members 1 2
            config sla
                edit 1
                    set link-cost-factor latency jitter packet-loss
                    set latency-threshold 250
                    set jitter-threshold 50
                    set packetloss-threshold 5
                next
            end
        next
    end
    config service
        edit 1
            set name "INET_via_BOR"
            set mode priority
            set dst "all"
            set health-check "SIA_Health"
            set link-cost-factor packet-loss
            set priority-members 1 2 3
        next
    end
end

config firewall policy
    # --- Fabric (SPA hub) plane ---
    edit 10
        set name "Fabric hairpin (spoke-to-spoke)"
        set srcintf "SASE_Hub"
        set dstintf "SASE_Hub"
        set srcaddr "all"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "ALL"
    next
    edit 11
        set name "LAN to Fabric"
        set srcintf "port2"
        set dstintf "SASE_Hub"
        set srcaddr "hub-5-LAN"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "ALL"
    next
    edit 12
        set name "Fabric to LAN"
        set srcintf "SASE_Hub"
        set dstintf "port2"
        set srcaddr "all"
        set dstaddr "hub-5-LAN"
        set action accept
        set schedule "always"
        set service "ALL"
    next
    edit 13
        set name "Fabric to Loopback"
        set srcintf "SASE_Hub"
        set dstintf "SASE_Hub_Lo"
        set srcaddr "all"
        set dstaddr "SASE_Hub-Loopback"
        set action accept
        set schedule "always"
        set service "ALL"
    next
    # --- Hub's own BOR/SIA egress ---
    edit 1
        set name "LAN to BOR (SIA)"
        set srcintf "port2"
        set dstintf "SDWAN_ZONE"
        set srcaddr "hub-5-LAN"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "ALL"
        set logtraffic all
    next
    edit 3
        set name "LAN to Underlay (fallback)"
        set srcintf "port2"
        set dstintf "Underlay_ZONE"
        set srcaddr "hub-5-LAN"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "ALL"
        set nat enable
        set logtraffic all
    next
end
