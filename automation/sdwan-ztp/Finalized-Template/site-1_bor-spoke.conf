# ============================================================================
# BOR NODE — Site-1 (spoke-1)   [instantiated from bor-spoke.conf]
# router-id 10.30.1.100 · WAN 10.200.1.0/24 · LAN 10.200.10.0/24
# NOTE: PSKs shown as <INJECT_AT_DEPLOY> — pushed at deploy via secure credential
#       provider (per-PoP FortiSASE BOR location PSK). Never store here.
# REVIEW: [R1] auto-firmware-upgrade disabled  [R2] 160.223.174.119 dropped (FQDN covers)
# ============================================================================

config system global
    set hostname "spoke-1"
    set alias "FortiGate-ARM64-AWS"
    set timezone "US/Pacific"
    set admin-sport 10443
    set admintimeout 480
    set gui-auto-upgrade-setup-warning disable
end

config system fortiguard
    set auto-firmware-upgrade disable
end

config system settings
    set auxiliary-session enable
end

config system interface
    edit "port1"
        set alias "WAN"
        set ip 10.200.1.10 255.255.255.0
        set allowaccess ping https ssh fgfm
        set role wan
        set mtu-override enable
        set mtu 9001
    next
    edit "port2"
        set alias "LAN"
        set ip 10.200.10.10 255.255.255.0
        set allowaccess ping https ssh
        set role lan
        set mtu-override enable
        set mtu 9001
    next
    edit "ONRAMP_Dallas"
        set type tunnel
        set interface "port1"
    next
    edit "ONRAMP_MIA"
        set type tunnel
        set interface "port1"
    next
end

config firewall address
    edit "spoke-1-LAN"
        set subnet 10.200.10.0 255.255.255.0
    next
    edit "ONRAMP_DAL_PUBLIC"
        set type fqdn
        set allow-routing enable
        set fqdn "ipsec-<tenant>-dfw-f3.prod.fortisase.com"
    next
    edit "ONRAMP_MIA_PUBLIC"
        set type fqdn
        set allow-routing enable
        set fqdn "ipsec-<tenant>-mia-f3.prod.fortisase.com"
    next
end

config vpn ipsec phase1-interface
    edit "ONRAMP_Dallas"
        set type ddns
        set interface "port1"
        set ike-version 2
        set peertype any
        set net-device disable
        set mode-cfg enable
        set proposal aes256-sha256
        set dhgrp 5 14
        set network-overlay enable
        set network-id 0
        set transport auto
        set fortinet-esp enable
        set dpd on-idle
        set remotegw-ddns "ipsec-<tenant>-dfw-f3.prod.fortisase.com"
        set psksecret <INJECT_AT_DEPLOY>
    next
    edit "ONRAMP_MIA"
        set type ddns
        set interface "port1"
        set ike-version 2
        set peertype any
        set net-device disable
        set mode-cfg enable
        set proposal aes256-sha256
        set dhgrp 5 14
        set network-overlay enable
        set network-id 0
        set transport auto
        set fortinet-esp enable
        set dpd on-idle
        set remotegw-ddns "ipsec-<tenant>-mia-f3.prod.fortisase.com"
        set psksecret <INJECT_AT_DEPLOY>
    next
end

config vpn ipsec phase2-interface
    edit "ONRAMP_Dallas"
        set phase1name "ONRAMP_Dallas"
        set proposal aes256-sha256
        set dhgrp 5 14
    next
    edit "ONRAMP_MIA"
        set phase1name "ONRAMP_MIA"
        set proposal aes256-sha256
        set dhgrp 5 14
    next
end

config router static
    edit 1
        set gateway 10.200.1.1
        set distance 20
        set device "port1"
        set comment "Floating WAN default (fallback; primary default via on-ramps)"
    next
    edit 5
        set dst 172.16.8.1 255.255.255.255
        set device "ONRAMP_Dallas"
        set comment "BOR DAL node (BGP peer)"
    next
    edit 8
        set dst 172.16.0.1 255.255.255.255
        set device "ONRAMP_MIA"
        set comment "BOR MIA node (BGP peer)"
    next
    edit 6
        set dstaddr "ONRAMP_DAL_PUBLIC"
        set gateway 10.200.1.1
        set device "port1"
        set comment "DAL BOR PoP public via WAN"
    next
    edit 7
        set dstaddr "ONRAMP_MIA_PUBLIC"
        set gateway 10.200.1.1
        set device "port1"
        set comment "MIA BOR PoP public via WAN"
    next
    edit 10
        set dst 203.0.113.1 255.255.255.255
        set gateway 10.200.1.1
        set device "port1"
        set comment "Bastion / management return path (trusted host)"
    next
end

config router bgp
    set as 65001
    set router-id 10.30.1.100
    set keepalive-timer 15
    set holdtime-timer 45
    set ibgp-multipath enable
    set recursive-next-hop enable
    set scan-time 5
    set graceful-restart enable
    config neighbor
        edit "172.16.8.1"
            set interface "ONRAMP_Dallas"
            set update-source "ONRAMP_Dallas"
            set remote-as 65001
            set advertisement-interval 1
            set connect-timer 1
            set capability-graceful-restart enable
            set link-down-failover enable
            set next-hop-self enable
            set soft-reconfiguration enable
        next
        edit "172.16.0.1"
            set interface "ONRAMP_MIA"
            set update-source "ONRAMP_MIA"
            set remote-as 65001
            set advertisement-interval 1
            set connect-timer 1
            set capability-graceful-restart enable
            set link-down-failover enable
            set next-hop-self enable
            set soft-reconfiguration enable
        next
    end
    config network
        edit 1
            set prefix 10.200.10.0 255.255.255.0
        next
    end
end

config system sdwan
    set status enable
    config zone
        edit "SDWAN_ZONE"
        next
        edit "Underlay_ZONE"
        next
    end
    config members
        edit 1
            set interface "ONRAMP_Dallas"
            set zone "SDWAN_ZONE"
        next
        edit 2
            set interface "ONRAMP_MIA"
            set zone "SDWAN_ZONE"
        next
        edit 3
            set interface "port1"
            set zone "Underlay_ZONE"
            set gateway 10.200.1.1
        next
    end
    config health-check
        edit "SIA_Health"
            set server "8.8.8.8" "1.1.1.1"
            set members 1 2
            config sla
                edit 1
                    set link-cost-factor latency jitter packet-loss
                    set latency-threshold 250
                    set jitter-threshold 50
                    set packetloss-threshold 5
                next
            end
        next
    end
    config service
        edit 1
            set name "INET_via_BOR"
            set mode priority
            set dst "all"
            set health-check "SIA_Health"
            set link-cost-factor packet-loss
            set priority-members 1 2 3
        next
    end
end

config firewall policy
    edit 1
        set name "LAN to BOR (SIA)"
        set srcintf "port2"
        set dstintf "SDWAN_ZONE"
        set srcaddr "spoke-1-LAN"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "ALL"
        set logtraffic all
    next
    edit 2
        set name "BOR to LAN (return)"
        set srcintf "SDWAN_ZONE"
        set dstintf "port2"
        set srcaddr "all"
        set dstaddr "spoke-1-LAN"
        set action accept
        set schedule "always"
        set service "ALL"
        set logtraffic all
    next
    edit 3
        set name "LAN to Underlay (fallback)"
        set srcintf "port2"
        set dstintf "Underlay_ZONE"
        set srcaddr "spoke-1-LAN"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "ALL"
        set nat enable
        set logtraffic all
    next
end
