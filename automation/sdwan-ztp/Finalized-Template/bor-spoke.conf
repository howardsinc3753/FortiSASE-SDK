# ============================================================================
# ROLE: BOR NODE  —  FortiSASE Branch On-Ramp SD-WAN spoke   [FINALIZED TEMPLATE]
# Dual on-ramp (Dallas + Miami) · single WAN · AS 65001 · security in the cloud
# Replace {{VARS}}. Supersedes ../templates/bor-spoke.DRAFT.conf
# ----------------------------------------------------------------------------
# REVIEW POINTS (Daniel — strike/keep):
#   [R1] `config system fortiguard / set auto-firmware-upgrade disable` ADDED
#        (controlled ZTP fleet). Strike if you want FortiGuard-managed upgrades.
#   [R2] Hardcoded 160.223.174.119/32 DROPPED — the FQDN PoP-public routes cover it.
#        Re-add as a static anchor if you prefer.
#   [R3] ROUTER_ID assigned sequentially from 10.30.1.100 (avoids PoP-reserved .1-6).
# ----------------------------------------------------------------------------
# DEPLOYMENT GLOBALS (this FortiSASE tenant → per-tenant vars in the UI):
#   BGP_AS=65001 · DAL_POP_FQDN=ipsec-<tenant>-dfw-f3.prod.fortisase.com
#   MIA_POP_FQDN=ipsec-<tenant>-mia-f3.prod.fortisase.com
#   DAL_BOR_NODE=172.16.8.1 · MIA_BOR_NODE=172.16.0.1 (BGP peers)
#   ADMIN_SPORT=10443 · ONRAMP proposal aes256-sha256 / dhgrp 5 14 / network-id 0
#   ROUTER_ID space = 10.30.1.0/24 (start .100)
# ============================================================================

config system global
    set hostname "{{HOSTNAME}}"
    set alias "{{DEVICE_ALIAS}}"
    set timezone "{{TIMEZONE}}"
    set admin-sport 10443
    set admintimeout 480
    set gui-auto-upgrade-setup-warning disable
end

# [R1] Controlled firmware — no unattended auto-upgrade on the ZTP fleet
config system fortiguard
    set auto-firmware-upgrade disable
end

config system settings
    set auxiliary-session enable
end

config system interface
    edit "port1"
        set alias "WAN"
        set ip {{WAN_IP}} {{WAN_MASK}}
        set allowaccess ping https ssh fgfm
        set role wan
        set mtu-override enable
        set mtu 9001
    next
    edit "port2"
        set alias "LAN"
        set ip {{LAN_GW}} {{LAN_MASK}}
        set allowaccess ping https ssh
        set role lan
        set mtu-override enable
        set mtu 9001
    next
    edit "ONRAMP_Dallas"
        set type tunnel
        set interface "port1"
    next
    edit "ONRAMP_MIA"
        set type tunnel
        set interface "port1"
    next
end

config firewall address
    edit "{{HOSTNAME}}-LAN"
        set subnet {{LAN_SUBNET}} {{LAN_MASK}}
    next
    edit "ONRAMP_DAL_PUBLIC"
        set type fqdn
        set allow-routing enable
        set fqdn "{{DAL_POP_FQDN}}"
    next
    edit "ONRAMP_MIA_PUBLIC"
        set type fqdn
        set allow-routing enable
        set fqdn "{{MIA_POP_FQDN}}"
    next
end

config vpn ipsec phase1-interface
    edit "ONRAMP_Dallas"
        set type ddns
        set interface "port1"
        set ike-version 2
        set peertype any
        set net-device disable
        set mode-cfg enable
        set proposal aes256-sha256
        set dhgrp 5 14
        set network-overlay enable
        set network-id 0
        set transport auto
        set fortinet-esp enable
        set dpd on-idle
        set remotegw-ddns "{{DAL_POP_FQDN}}"
        set psksecret {{PSK_DAL}}
    next
    edit "ONRAMP_MIA"
        set type ddns
        set interface "port1"
        set ike-version 2
        set peertype any
        set net-device disable
        set mode-cfg enable
        set proposal aes256-sha256
        set dhgrp 5 14
        set network-overlay enable
        set network-id 0
        set transport auto
        set fortinet-esp enable
        set dpd on-idle
        set remotegw-ddns "{{MIA_POP_FQDN}}"
        set psksecret {{PSK_MIA}}
    next
end

config vpn ipsec phase2-interface
    edit "ONRAMP_Dallas"
        set phase1name "ONRAMP_Dallas"
        set proposal aes256-sha256
        set dhgrp 5 14
    next
    edit "ONRAMP_MIA"
        set phase1name "ONRAMP_MIA"
        set proposal aes256-sha256
        set dhgrp 5 14
    next
end

# Explicit routes REQUIRED because the default is advertised across the tunnels:
#  - BOR node IPs via their tunnels (BGP peers reachable at 10+ PoPs)
#  - PoP publics via WAN (FQDN, self-updating) so tunnel setup isn't blackholed
config router static
    edit 1
        set gateway {{WAN_GATEWAY}}
        set distance 20
        set device "port1"
        set comment "Floating WAN default (fallback; primary default via on-ramps)"
    next
    edit 5
        set dst 172.16.8.1 255.255.255.255
        set device "ONRAMP_Dallas"
        set comment "BOR DAL node (BGP peer)"
    next
    edit 8
        set dst 172.16.0.1 255.255.255.255
        set device "ONRAMP_MIA"
        set comment "BOR MIA node (BGP peer)"
    next
    edit 6
        set dstaddr "ONRAMP_DAL_PUBLIC"
        set gateway {{WAN_GATEWAY}}
        set device "port1"
        set comment "DAL BOR PoP public via WAN"
    next
    edit 7
        set dstaddr "ONRAMP_MIA_PUBLIC"
        set gateway {{WAN_GATEWAY}}
        set device "port1"
        set comment "MIA BOR PoP public via WAN"
    next
    edit 10
        set dst {{BASTION_MGMT_SUBNET}} {{BASTION_MGMT_MASK}}
        set gateway {{WAN_GATEWAY}}
        set device "port1"
        set comment "Bastion / management return path (trusted host)"
    next
end

# iBGP to the two BOR nodes — explicit network only (NO redistribute → no leaks)
config router bgp
    set as 65001
    set router-id {{ROUTER_ID}}
    set keepalive-timer 15
    set holdtime-timer 45
    set ibgp-multipath enable
    set recursive-next-hop enable
    set scan-time 5
    set graceful-restart enable
    config neighbor
        edit "172.16.8.1"
            set interface "ONRAMP_Dallas"
            set update-source "ONRAMP_Dallas"
            set remote-as 65001
            set advertisement-interval 1
            set connect-timer 1
            set capability-graceful-restart enable
            set link-down-failover enable
            set next-hop-self enable
            set soft-reconfiguration enable
        next
        edit "172.16.0.1"
            set interface "ONRAMP_MIA"
            set update-source "ONRAMP_MIA"
            set remote-as 65001
            set advertisement-interval 1
            set connect-timer 1
            set capability-graceful-restart enable
            set link-down-failover enable
            set next-hop-self enable
            set soft-reconfiguration enable
        next
    end
    config network
        edit 1
            set prefix {{LAN_SUBNET}} {{LAN_MASK}}
        next
    end
end

# SD-WAN: steer internet/SIA across the 2 on-ramps, WAN underlay as fallback
config system sdwan
    set status enable
    config zone
        edit "SDWAN_ZONE"
        next
        edit "Underlay_ZONE"
        next
    end
    config members
        edit 1
            set interface "ONRAMP_Dallas"
            set zone "SDWAN_ZONE"
        next
        edit 2
            set interface "ONRAMP_MIA"
            set zone "SDWAN_ZONE"
        next
        edit 3
            set interface "port1"
            set zone "Underlay_ZONE"
            set gateway {{WAN_GATEWAY}}
        next
    end
    config health-check
        edit "SIA_Health"
            set server "8.8.8.8" "1.1.1.1"
            set members 1 2
            config sla
                edit 1
                    set link-cost-factor latency jitter packet-loss
                    set latency-threshold 250
                    set jitter-threshold 50
                    set packetloss-threshold 5
                next
            end
        next
    end
    config service
        edit 1
            set name "INET_via_BOR"
            set mode priority
            set dst "all"
            set health-check "SIA_Health"
            set link-cost-factor packet-loss
            set priority-members 1 2 3
        next
    end
end

# Zones only; SNAT ONLY on underlay breakout (fixes site-2 NAT inversion)
config firewall policy
    edit 1
        set name "LAN to BOR (SIA)"
        set srcintf "port2"
        set dstintf "SDWAN_ZONE"
        set srcaddr "{{HOSTNAME}}-LAN"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "ALL"
        set logtraffic all
    next
    edit 2
        set name "BOR to LAN (return)"
        set srcintf "SDWAN_ZONE"
        set dstintf "port2"
        set srcaddr "all"
        set dstaddr "{{HOSTNAME}}-LAN"
        set action accept
        set schedule "always"
        set service "ALL"
        set logtraffic all
    next
    edit 3
        set name "LAN to Underlay (fallback)"
        set srcintf "port2"
        set dstintf "Underlay_ZONE"
        set srcaddr "{{HOSTNAME}}-LAN"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "ALL"
        set nat enable
        set logtraffic all
    next
end
